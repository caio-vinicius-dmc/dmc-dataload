<!DOCTYPE html>
<html>
<head>
    <title>Teste Rápido - APIs Mockadas</title>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body>
    <h1>Teste de Mock de APIs</h1>
    <div id="resultado"></div>
    <div id="console"></div>
    
    <script>
        const baseUrl = '/DMC-DATALOAD/public';
        
        function log(msg) {
            document.getElementById('console').innerHTML += msg + '<br>';
            console.log(msg);
        }
        
        log('1. Iniciando teste...');
        
        // Override getJSON
        const originalGetJSON = $.getJSON;
        $.getJSON = function(url, success) {
            log('2. Interceptado: ' + url);
            
            if (url.includes('/api/apis-externas/list')) {
                log('3. Redirecionando para mock...');
                const mockUrl = '/DMC-DATALOAD/test_workflow_apis.php?api_mock=list';
                return originalGetJSON.call(this, mockUrl, success);
            }
            
            return originalGetJSON.apply(this, arguments);
        };
        
        log('4. Override configurado, fazendo requisição...');
        
        // Testar
        $.getJSON(baseUrl + '/api/apis-externas/list', function(res) {
            log('5. Resposta recebida!');
            log('6. Sucesso: ' + res.sucesso);
            log('7. Dados: ' + JSON.stringify(res.dados));
            
            if (res.sucesso && res.dados && res.dados.length > 0) {
                document.getElementById('resultado').innerHTML = 
                    '<h2 style="color: green;">✅ SUCESSO!</h2>' +
                    '<p>APIs carregadas: ' + res.dados.length + '</p>' +
                    '<ul>' + res.dados.map(api => '<li>' + api.nome + '</li>').join('') + '</ul>';
            }
        }).fail(function(xhr, status, error) {
            log('❌ ERRO: ' + status + ' - ' + error);
            document.getElementById('resultado').innerHTML = 
                '<h2 style="color: red;">❌ ERRO</h2>' +
                '<p>Status: ' + status + '</p>' +
                '<p>Error: ' + error + '</p>';
        });
    </script>
</body>
</html>
